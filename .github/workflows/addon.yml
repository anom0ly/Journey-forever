name: Addon

on:
  push:
    branches: [main]
    paths: ["addon/**", ".github/workflows/addon.yml"]
    tags: ["addon-v*"]
  workflow_dispatch: # run from the Actions tab to tag and release the version in the .toc
  pull_request:
    paths: ["addon/**", ".github/workflows/addon.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Lua 5.1 and luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 liblua5.1-0-dev luarocks
          sudo luarocks install luacheck
      - name: Lint
        working-directory: addon
        run: luacheck JourneyForever
      - name: Test (UTC and a US time zone)
        run: |
          TZ=UTC lua5.1 addon/tests/run.lua
          TZ=America/Los_Angeles lua5.1 addon/tests/run.lua

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/addon-v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Work out the version and tag
        id: version
        run: |
          toc=$(sed -n 's/^## Version: *//p' addon/JourneyForever/JourneyForever.toc | tr -d '\r')
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="addon-v$toc"
          else
            tag="$GITHUB_REF_NAME"
            if [ "${tag#addon-v}" != "$toc" ]; then
              echo "Tag says ${tag#addon-v} but JourneyForever.toc says $toc" >&2
              exit 1
            fi
          fi
          echo "version=$toc" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Zip the addon
        run: |
          cd addon
          zip -r "../JourneyForever-${{ steps.version.outputs.version }}.zip" JourneyForever
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ZIP: JourneyForever-${{ steps.version.outputs.version }}.zip
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" --target "$GITHUB_SHA" \
              --title "Journey Forever addon ${{ steps.version.outputs.version }}" \
              --notes "Download $ZIP below (not the Source code zips, which hold the whole repo). Unzip it into World of Warcraft\\_forever_\\Interface\\AddOns\\ so you get AddOns\\JourneyForever\\JourneyForever.toc. See addon/README.md."
          fi
      - name: Work out the Forever game version
        id: game
        run: |
          # Interface 16001 is game version 1.60.1 (major, minor, patch)
          iface=$(sed -n 's/^## Interface: *//p' addon/JourneyForever/JourneyForever.toc | tr -d '\r' | cut -d, -f1 | tr -d ' ')
          patch="$((iface / 10000)).$((iface / 100 % 100)).$((iface % 100))"
          echo "patch=$patch" >> "$GITHUB_OUTPUT"
          echo "Forever game version $patch (interface $iface)"
      - name: Upload to CurseForge
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
          PATCH: ${{ steps.game.outputs.patch }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: JourneyForever-${{ steps.version.outputs.version }}.zip
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}
        run: |
          if [ -z "$CF_API_KEY" ] || [ -z "$CF_PROJECT_ID" ]; then
            echo "::notice::CF_API_KEY secret or CF_PROJECT_ID variable not set, skipping CurseForge"
            exit 0
          fi
          versions=$(curl -sSf --retry 3 -H "X-Api-Token: $CF_API_KEY" https://wow.curseforge.com/api/game/versions)
          # 88568 is CurseForge's "Forever" version type. Use the exact patch, or else the newest Forever patch.
          id=$(jq -r --arg v "$PATCH" '[.[] | select(.gameVersionTypeID == 88568 and .name == $v)][0].id // empty' <<< "$versions")
          if [ -z "$id" ]; then
            id=$(jq -r '[.[] | select(.gameVersionTypeID == 88568)] | max_by(.id).id // empty' <<< "$versions")
            echo "::warning::CurseForge has no Forever $PATCH, using its newest Forever version (id $id)"
          fi
          [ -n "$id" ] || { echo "No Forever game version on CurseForge" >&2; exit 1; }
          metadata=$(jq -n --arg name "$VERSION" --argjson id "$id" --arg url "$RELEASE_URL" \
            '{displayName: $name, gameVersions: [$id], releaseType: "release", changelogType: "markdown",
              changelog: "Journey Forever addon \($name). Release notes: \($url)"}')
          code=$(curl -sS --retry 3 -o cf-result.json -w '%{http_code}' -H "X-Api-Token: $CF_API_KEY" \
            -F "metadata=<-" -F "file=@$ZIP" <<< "$metadata" \
            "https://wow.curseforge.com/api/projects/$CF_PROJECT_ID/upload-file")
          cat cf-result.json; echo
          [ "$code" = 200 ] || { echo "CurseForge upload failed (HTTP $code)" >&2; exit 1; }
      - name: Upload to Wago
        if: always() && steps.game.outcome == 'success' # still try Wago if CurseForge failed
        env:
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          WAGO_PROJECT_ID: ${{ vars.WAGO_PROJECT_ID }}
          PATCH: ${{ steps.game.outputs.patch }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: JourneyForever-${{ steps.version.outputs.version }}.zip
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}
        run: |
          if [ -z "$WAGO_API_TOKEN" ] || [ -z "$WAGO_PROJECT_ID" ]; then
            echo "::notice::WAGO_API_TOKEN secret or WAGO_PROJECT_ID variable not set, skipping Wago"
            exit 0
          fi
          metadata=$(jq -n --arg name "$VERSION" --arg patch "$PATCH" --arg url "$RELEASE_URL" \
            '{label: $name, supported_forever_patches: [$patch], stability: "stable",
              changelog: "Journey Forever addon \($name). Release notes: \($url)"}')
          code=$(curl -sS --retry 3 -o wago-result.json -w '%{http_code}' \
            -H "Authorization: Bearer $WAGO_API_TOKEN" -H "Accept: application/json" \
            -F "metadata=<-" -F "file=@$ZIP" <<< "$metadata" \
            "https://addons.wago.io/api/projects/$WAGO_PROJECT_ID/version")
          cat wago-result.json; echo
          case "$code" in 200|201) ;; *) echo "Wago upload failed (HTTP $code)" >&2; exit 1 ;; esac
